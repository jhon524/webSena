{% extends 'base.html' %}

{% block title %}Publicaciones{% endblock %}

{% block content %}

<h1>Lista de Publicaciones</h1>

{% for pub in publicaciones %}
    <div>
        <h3>{{ pub.titulo }}</h3>
        <p>{{ pub.contenido|truncatewords:20 }}</p>
        <a href="/publicaciones/{{ pub.id }}/">Ver más</a>
    </div>
    <hr>
{% endfor %}

{% endblock %}
